server:
  port: 8071

spring:
  application:
    name: product-service

  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false


management:
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: "*"

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.spi: DEBUG
    io.r2dbc.h2: DEBUG

eureka:
  client:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: mtls
  ssl:
    bundle:
      jks:
        mtls:
          keystore:
            location: file:/etc/mtls/server.p12
            password: ${P12_PASSWORD}
            type: PKCS12
          key:
            alias: product-service
          truststore:
            location: file:/etc/mtls/truststore.p12
            password: ${P12_PASSWORD}
            type: PKCS12

server:
  port: 8443
  ssl:
    enabled: true
    bundle: mtls
    client-auth: need
    enabled-protocols: TLSv1.3,TLSv1.2

management:
  server:
    port: 8081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka.lorrconnect.svc.cluster.local:8761/eureka
  instance:
    hostname: product-service.default.svc.cluster.local
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${HOSTNAME}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 8443