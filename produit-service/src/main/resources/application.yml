server:
  port: 8071

spring:
  application:
    name: product-service      # nom utilisé par la gateway (lb://product-service) et k8s : ne pas changer

  r2dbc:
    url: ${PRODUIT_DB_URL:r2dbc:h2:mem:///produitdb;DB_CLOSE_DELAY=-1}
    username: ${PRODUIT_DB_USER:sa}
    password: ${PRODUIT_DB_PASSWORD:}

  sql:
    init:
      mode: always                # crée les tables au démarrage (IF NOT EXISTS)
      schema-locations: classpath:schema.sql

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:30090/realms/lorrconnect}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.default.svc.cluster.local:8080/realms/lorrconnect/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.gestion: INFO

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
---
spring:
  config:
    activate:
      on-profile: mtls
  ssl:
    bundle:
      jks:
        mtls:
          keystore:
            location: file:/etc/mtls/server.p12
            password: ${P12_PASSWORD}
            type: PKCS12
          key:
            alias: product-service
          truststore:
            location: file:/etc/mtls/truststore.p12
            password: ${P12_PASSWORD}
            type: PKCS12

server:
  port: 8443
  ssl:
    enabled: true
    bundle: mtls
    client-auth: need
    enabled-protocols: TLSv1.3,TLSv1.2

management:
  server:
    port: 8081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka.lorrconnect.svc.cluster.local:8761/eureka
  instance:
    hostname: product-service.default.svc.cluster.local
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${HOSTNAME}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 8443
