apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: product-service
      containers:
        - name: product-service
          image: product-service:mtls
          imagePullPolicy: Never
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: mtls
            - name: P12_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-service-mtls
                  key: P12_PASSWORD
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8081
          volumeMounts:
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /manage/health/readiness
              port: management
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /manage/health/liveness
              port: management
            initialDelaySeconds: 30
      volumes:
        - name: mtls
          secret:
            secretName: product-service-mtls
            items:
              - key: server.p12
                path: server.p12
              - key: truststore.p12
                path: truststore.p12
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  type: NodePort
  selector:
    app: product-service
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30443
