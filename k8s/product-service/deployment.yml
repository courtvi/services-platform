apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: product-service
      containers:
        - name: product-service
          image: product-service:mtls
          imagePullPolicy: Never
          env:
            # OpenTelemetry : l'agent est dans l'image, activé ici ; export vers otel-lgtm (k8s/observability)
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/grafana-opentelemetry-java.jar"
            - name: OTEL_SERVICE_NAME
              value: product-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm.lorrconnect.svc.cluster.local:4318
            # Nom du pod comme identifiant d'instance : lisible dans les filtres Grafana (au lieu d'un UUID)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=k3s,service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)
            - name: SPRING_PROFILES_ACTIVE
              value: mtls
            - name: P12_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-service-mtls
                  key: P12_PASSWORD
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8081
          volumeMounts:
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /manage/health/readiness
              port: management
            initialDelaySeconds: 15
          # Laisse jusqu'à 5 min au démarrage (tous les pods démarrent en même temps au reboot) ;
          # la liveness ne prend le relais qu'une fois le démarrage réussi
          startupProbe:
            httpGet:
              path: /manage/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /manage/health/liveness
              port: management
            initialDelaySeconds: 30
      volumes:
        - name: mtls
          secret:
            secretName: product-service-mtls
            items:
              - key: server.p12
                path: server.p12
              - key: truststore.p12
                path: truststore.p12
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  type: NodePort
  selector:
    app: product-service
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30443
