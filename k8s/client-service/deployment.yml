apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-service
  namespace: lorrconnect
  labels:
    app: client-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-service
  template:
    metadata:
      labels:
        app: client-service
    spec:
      containers:
        - name: client-service
          image: client-service:latest
          imagePullPolicy: Never
          ports:
            - name: https
              containerPort: 8445
            - name: management
              containerPort: 9083
          env:
            # OpenTelemetry : l'agent est dans l'image, activé ici ; export vers otel-lgtm (k8s/observability)
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/grafana-opentelemetry-java.jar"
            - name: OTEL_SERVICE_NAME
              value: client-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm.lorrconnect.svc.cluster.local:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=k3s
            - name: SPRING_PROFILES_ACTIVE
              value: mtls
            - name: P12_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: client-service-mtls
                  key: P12_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:30090/realms/lorrconnect"
            - name: KEYCLOAK_JWK_SET_URI
              value: "http://keycloak:8080/realms/lorrconnect/protocol/openid-connect/certs"
            - name: EUREKA_URL
              value: "http://eureka:8761/eureka"
          volumeMounts:
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /manage/health/readiness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          # Laisse jusqu'à 5 min au démarrage (tous les pods démarrent en même temps au reboot) ;
          # la liveness ne prend le relais qu'une fois le démarrage réussi
          startupProbe:
            httpGet:
              path: /manage/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /manage/health/liveness
              port: management
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: mtls
          secret:
            secretName: client-service-mtls
            items:
              - key: client-service.p12
                path: client-service.p12
              - key: truststore.p12
                path: truststore.p12
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: lorrconnect
spec:
  type: ClusterIP          # accessible uniquement via la gateway (mTLS)
  selector:
    app: client-service
  ports:
    - name: https
      port: 8445
      targetPort: https
