# =============================================================================
# Observabilité : grafana/otel-lgtm (collecteur OpenTelemetry + Prometheus + Tempo + Loki + Grafana)
# dans un seul pod. Image prévue pour le développement et les tests, pas pour la production.
#
#   - Les services y envoient traces, métriques et logs en OTLP/HTTP :
#       http://otel-lgtm.lorrconnect.svc.cluster.local:4318
#   - Grafana n'est PAS exposé (ClusterIP, aucune route Cloudflare) : on y accède en local
#       kubectl port-forward -n lorrconnect service/otel-lgtm 3000:3000   →  http://localhost:3000
#     (k8s/port-forward.ps1 le fait aussi)
#   - Données sur un volume persistant : elles survivent aux redémarrages du pod.
# =============================================================================
# Configuration du collecteur OpenTelemetry : celle de l'image grafana/otel-lgtm 0.29.2
# (docker/otelcol-config.yaml), complétée par la collecte des métriques Postgres et Keycloak.
# Après une modification : kubectl rollout restart deployment/otel-lgtm -n lorrconnect
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-lgtm-collector
  namespace: lorrconnect
data:
  otelcol-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - http://*
      prometheus/collector:
        config:
          scrape_configs:
            - job_name: "opentelemetry-collector"
              scrape_interval: 1s
              static_configs:
                - targets: ["127.0.0.1:8888"]
            # --- ajouts services-platform ---
            - job_name: "postgres"
              scrape_interval: 30s
              static_configs:
                - targets: ["postgres-commande.lorrconnect.svc.cluster.local:9187"]
                  labels:
                    database: commande
                - targets: ["postgres-keycloak.lorrconnect.svc.cluster.local:9187"]
                  labels:
                    database: keycloak
            - job_name: "keycloak"
              scrape_interval: 30s
              metrics_path: /metrics
              static_configs:
                - targets: ["keycloak-management.lorrconnect.svc.cluster.local:9000"]

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: "/ready"

    processors:
      batch:

    exporters:
      otlp_http/metrics:
        endpoint: http://127.0.0.1:9090/api/v1/otlp
        tls:
          insecure: true
      otlp_http/traces:
        endpoint: http://127.0.0.1:4418
        tls:
          insecure: true
      otlp_http/logs:
        endpoint: http://127.0.0.1:3100/otlp
        tls:
          insecure: true
      otlp_grpc/profiles:
        endpoint: http://127.0.0.1:4040
        tls:
          insecure: true

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/traces]
        metrics:
          receivers: [otlp, prometheus/collector]
          processors: [batch]
          exporters: [otlp_http/metrics]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/logs]
        profiles:
          receivers: [otlp]
          exporters: [otlp_grpc/profiles]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-lgtm-data
  namespace: lorrconnect
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: lorrconnect
  labels:
    app: otel-lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate              # volume ReadWriteOnce : jamais deux pods en même temps
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
      annotations:
        # à incrémenter quand la ConfigMap change : redémarre le pod au déploiement suivant
        services-platform/collector-config: "1"
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.29.2
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            # Métriques conservées 7 jours
            - name: PROMETHEUS_EXTRA_ARGS
              value: "--storage.tsdb.retention.time=7d"
          volumeMounts:
            - name: data
              mountPath: /data
            # remplace la configuration du collecteur fournie par l'image
            - name: collector-config
              mountPath: /otel-lgtm/otelcol-config.yaml
              subPath: otelcol-config.yaml
          startupProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 15
          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otel-lgtm-data
        - name: collector-config
          configMap:
            name: otel-lgtm-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: lorrconnect
spec:
  type: ClusterIP
  selector:
    app: otel-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
