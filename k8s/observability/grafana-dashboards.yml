# =============================================================================
# FICHIER GÉNÉRÉ par k8s/observability/gen-dashboards.py : ne pas modifier à la main.
# Tableaux de bord Grafana provisionnés dans otel-lgtm (dossier « services-platform »).
# Grafana relit les tableaux toutes les 30 s : pas besoin de redémarrer le pod.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: lorrconnect
data:
  custom.yaml: |
    apiVersion: 1
    providers:
      - name: services-platform
        folder: services-platform
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /otel-lgtm/grafana/conf/provisioning/dashboards/custom
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: lorrconnect
data:
  golden-signals.json: |
    {
      "uid": "sp-golden-signals",
      "title": "Golden signals",
      "description": "Trafic, erreurs, latence et saturation par service",
      "tags": [
        "services-platform"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "job",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(http_server_request_duration_seconds_count, job)",
              "refId": "job"
            },
            "definition": "label_values(http_server_request_duration_seconds_count, job)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "hide": 0
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "Vue d'ensemble (services sélectionnés)",
          "id": 1,
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "stat",
          "title": "Trafic",
          "description": "Requêtes par seconde (hors sondes Kubernetes), moyenne sur 5 min",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(http_server_request_duration_seconds_count{job=~\"$job\", http_route!~\"/manage.*\"}[5m]))",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Erreurs 5xx",
          "description": "Part des requêtes en erreur serveur (5xx) sur 5 min",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(rate(http_server_request_duration_seconds_count{job=~\"$job\", http_route!~\"/manage.*\", http_response_status_code=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job=~\"$job\", http_route!~\"/manage.*\"}[5m]))",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Latence p95",
          "description": "95 % des requêtes répondent en moins de cette durée (5 min)",
