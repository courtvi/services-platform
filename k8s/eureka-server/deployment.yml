apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: lorrconnect
  labels:
    app: eureka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: eureka-server:latest  # ✅ nom correct
          imagePullPolicy: Never
          ports:
            - containerPort: 8761
          env:
            # OpenTelemetry : l'agent est dans l'image, activé ici ; export vers otel-lgtm (k8s/observability)
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/grafana-opentelemetry-java.jar"
            - name: OTEL_SERVICE_NAME
              value: eureka-server
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm.lorrconnect.svc.cluster.local:4318
            # Nom du pod comme identifiant d'instance : lisible dans les filtres Grafana (au lieu d'un UUID)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=k3s,service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            # ✅ Empêche Eureka de s'enregistrer lui-même
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: SERVER_PORT
              value: "8761"
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"