apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: lorrconnect
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: api-gateway
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
            - name: management
              containerPort: 8091
          env:
            # OpenTelemetry : l'agent est dans l'image, activé ici ; export vers otel-lgtm (k8s/observability)
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm.lorrconnect.svc.cluster.local:4318
            # Nom du pod comme identifiant d'instance : lisible dans les filtres Grafana (au lieu d'un UUID)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=k3s,service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes,mtls"
            - name: P12_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-gateway-mtls
                  key: P12_PASSWORD
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://localhost:30090/realms/lorrconnect"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://keycloak:8080/realms/lorrconnect/protocol/openid-connect/certs"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/grafana-opentelemetry-java.jar -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
          volumeMounts:
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /manage/health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # Laisse jusqu'à 5 min au démarrage (tous les pods démarrent en même temps au reboot) ;
          # la liveness ne prend le relais qu'une fois le démarrage réussi
          startupProbe:
            httpGet:
              path: /manage/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /manage/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1500m"
      volumes:
        - name: mtls
          secret:
            secretName: api-gateway-mtls
            items:
              - key: api-gateway.p12
                path: api-gateway.p12
              - key: truststore.p12
                path: truststore.p12
