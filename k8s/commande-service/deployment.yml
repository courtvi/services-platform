apiVersion: apps/v1
kind: Deployment
metadata:
  name: commande-service
  namespace: lorrconnect
  labels:
    app: commande-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commande-service
  template:
    metadata:
      labels:
        app: commande-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: [ 'sh', '-c', 'until nc -z postgres-commande 5432; do echo waiting for postgres-commande; sleep 5; done' ]
      containers:
        - name: commande-service
          image: commande-service:latest
          imagePullPolicy: Never
          ports:
            - name: https
              containerPort: 8444
            - name: management
              containerPort: 9082
          env:
            # OpenTelemetry : l'agent est dans l'image, activé ici ; export vers otel-lgtm (k8s/observability)
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/grafana-opentelemetry-java.jar"
            - name: OTEL_SERVICE_NAME
              value: commande-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm.lorrconnect.svc.cluster.local:4318
            # Nom du pod comme identifiant d'instance : lisible dans les filtres Grafana (au lieu d'un UUID)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=k3s,service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)
            - name: SPRING_PROFILES_ACTIVE
              value: mtls
            - name: P12_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commande-service-mtls
                  key: P12_PASSWORD
            - name: EUREKA_URL
              value: "http://eureka:8761/eureka"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://localhost:30090/realms/lorrconnect"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://keycloak:8080/realms/lorrconnect/protocol/openid-connect/certs"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                 name: mail-secret
                 key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: MAIL_PASSWORD
            - name: SPRING_R2DBC_URL
              value: "r2dbc:postgresql://postgres-commande:5432/commandedb"
            - name: SPRING_R2DBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-commande-secret
                  key: POSTGRES_USER
            - name: SPRING_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-commande-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: mtls
              mountPath: /etc/mtls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /manage/health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: mtls
          secret:
            secretName: commande-service-mtls
            items:
              - key: commande-service.p12
                path: commande-service.p12
              - key: truststore.p12
                path: truststore.p12
