<div class="miel-topbar">
  <div class="miel-topbar-inner">
    <span class="miel-logo">
      <mat-icon>emoji_nature</mat-icon>
      Chabeille
    </span>
    <button mat-stroked-button class="panier-btn" [routerLink]="['/boutiques', boutiqueId, 'panier']">
      <span class="panier-icon-wrap">
      <mat-icon>shopping_cart</mat-icon>
      @if (nombreArticlesPanier() > 0) {
      <span class="panier-badge">{{ nombreArticlesPanier() }}</span>
      }
      </span>
      {{ 'boutiqueMiel.panier' | translate }}
    </button>
  </div>
</div>

<div class="hero">
  <div class="hero-inner">
    <span class="eyebrow">{{ 'boutiqueMiel.eyebrow' | translate }}</span>
    <h1>{{ 'boutiqueMiel.heroTitre' | translate }}</h1>
  </div>
</div>

<div class="container">

  <div class="container">
    <div class="catalogue-header">
      <h1>{{ 'boutiqueMiel.catalogueTitre' | translate }}</h1>
    </div>

    <div class="filtres">
    @for (filtre of filtres; track filtre.key) {
    <button class="filtre-chip" [class.active]="filtreActif() === filtre.key" (click)="choisirFiltre(filtre.key)">
      {{ filtre.labelCle | translate }}
    </button>
    }
  </div>

  <div class="produits-grid">
    @for (produit of produitsAffiches(); track produit.id) {
    <app-produit-card
      [produit]="produit"
      icone="emoji_nature"
      traductionPrefixe="produitsMiel"
      [lienDetail]="lienDetail(produit)"
      (ajouter)="ajouterAuPanier($event)" />
    }
  </div>
</div>
