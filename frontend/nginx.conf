server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Bundles Angular avec hash dans le nom (ex: main-a1b2c3d4.js) : cache long, sans risque
  location ~* "\-[a-z0-9]{6,20}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Tout le reste (JS/CSS non hashés, images, favicon) : jamais figé,
  # le navigateur/Cloudflare revalidatent à chaque fois (rapide via ETag, pas de re-téléchargement si inchangé)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    add_header Cache-Control "no-cache";
  }

  error_page 404 /index.html;
}
