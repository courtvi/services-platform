# ===== Config par défaut =====
spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/lorrconnect
          jwk-set-uri: http://keycloak:8080/realms/lorrconnect/protocol/openid-connect/certs

server:
  port: 8090

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:8761/eureka}

management:
  server:
    port: 8091
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

---
# ===== Profil mtls : la gateway présente son certificat à product-service =====
spring:
  config:
    activate:
      on-profile: mtls
  ssl:
    bundle:
      jks:
        product-mtls:
          keystore:
            location: file:/etc/mtls/api-gateway.p12
            password: ${P12_PASSWORD}
            type: PKCS12
          key:
            alias: api-gateway
          truststore:
            location: file:/etc/mtls/truststore.p12
            password: ${P12_PASSWORD}
            type: PKCS12
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            ssl:
              ssl-bundle: product-mtls
