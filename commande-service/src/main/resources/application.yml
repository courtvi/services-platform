app:
  produit-service:
    url: ${PRODUIT_SERVICE_URL:http://localhost:8071}   # lecture des prix (GET /api/products/{id})
  routes:
    base-path: /api/commandes
    path-id: /{id}

mail:
  from: ${MAIL_FROM:noreply@lorrconnect.local}

spring:
  application:
    name: commande-service

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

  sql:
    init:
      mode: always                                  # crée les tables au démarrage (IF NOT EXISTS)
      schema-locations: classpath:schema.sql
      data-locations: optional:classpath:none.sql   # pas de données de test hors profil dev

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:30090/realms/lorrconnect}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.default.svc.cluster.local:8080/realms/lorrconnect/protocol/openid-connect/certs}

server:
  port: 8082
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-service:8761/eureka}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ERROR
    org.gestion: INFO
    org.springframework.boot.sql.init: DEBUG

---
# ===== Profil mtls (k8s) : HTTPS avec certificat client obligatoire =====
# Le JWT Keycloak reste vérifié en plus : le mTLS authentifie le service appelant (gateway...),
# le JWT authentifie l'utilisateur.
spring:
  config:
    activate:
      on-profile: mtls
  ssl:
    bundle:
      jks:
        mtls:
          keystore:
            location: file:/etc/mtls/commande-service.p12
            password: ${P12_PASSWORD}
            type: PKCS12
          key:
            alias: commande-service
          truststore:
            location: file:/etc/mtls/truststore.p12
            password: ${P12_PASSWORD}
            type: PKCS12

app:
  produit-service:
    # Appel direct à produit-service (namespace default) en mTLS, avec le certificat de ce service.
    url: ${PRODUIT_SERVICE_URL:https://product-service.default.svc.cluster.local:8443}
    ssl-bundle: mtls

server:
  port: 8444
  ssl:
    enabled: true
    bundle: mtls
    client-auth: need
    enabled-protocols: TLSv1.3,TLSv1.2

# Sondes kubelet sur un port séparé, sans TLS
management:
  server:
    port: 9082
    ssl:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

# Enregistrement Eureka en HTTPS : la gateway (lb://commande-service) appellera https://...:8444
eureka:
  client:
    enabled: true
  instance:
    hostname: commande-service.lorrconnect.svc.cluster.local
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${HOSTNAME}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 8444
