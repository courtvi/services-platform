app:
  routes:
    base-path: /api/commandes
    path-id: /{id}

mail:
  from: ${MAIL_FROM:noreply@lorrconnect.local}

spring:
  application:
    name: commande-service

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      mode: always                                  # crée les tables au démarrage (IF NOT EXISTS)
      schema-locations: classpath:schema.sql
      data-locations: optional:classpath:none.sql   # pas de données de test hors profil dev

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:30090/realms/lorrconnect}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.default.svc.cluster.local:8080/realms/lorrconnect/protocol/openid-connect/certs}

server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-service:8761/eureka}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ERROR
    org.gestion: INFO
    org.springframework.boot.sql.init: DEBUG