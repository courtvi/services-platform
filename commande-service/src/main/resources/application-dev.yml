spring:
  application:
    name: commande-service

  mail:
    from: ${MAIL_FROM:${spring.mail.username}}
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  r2dbc:
    url: r2dbc:h2:mem:///commandedb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:30090/realms/lorrconnect
          jwk-set-uri: http://keycloak:8080/realms/lorrconnect/protocol/openid-connect/certs

server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka:8761/eureka

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

